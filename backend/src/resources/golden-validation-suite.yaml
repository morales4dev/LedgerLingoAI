# ==============================================================================
# FIXED GOLDEN QUESTIONS (Proof of Semantics)
# ==============================================================================
validation_questions:
  - id: "GQ-01"
    question: "What is our gross profit and gross margin % for COMP_ES in February 2026 in EUR?"
    tests_semantics: ["flow_period_filter", "gross_profit", "gross_margin_pct", "single_currency_filter"]
    expected_interpretation:
      metrics: ["gross_profit", "gross_margin_pct"]
      filters: { company_code: "COMP_ES", fiscal_year: 2026, fiscal_period: 2, currency: "EUR" }
    expected_result:
      gross_profit: 300.00       # 500 revenue - 200 COGS
      gross_margin_pct: 60.00    # (300 / 500) * 100

  - id: "GQ-02"
    question: "Calculate Operating Profit (EBIT) and EBITDA for COMP_ES in Q1 2026 in EUR."
    tests_semantics: ["multi_tag_no_double_counting", "operating_profit", "ebitda"]
    expected_interpretation:
      metrics: ["operating_profit", "ebitda"]
      filters: { company_code: "COMP_ES", posting_date_gte: "2026-01-01", posting_date_lt: "2026-04-01", currency: "EUR" }
    expected_result:
      operating_profit: 150.00   # 500 rev - 200 COGS - 150 OPEX (100 salaries + 50 depr)
      ebitda: 200.00             # 150 EBIT + 50 D&A (verifies 6800 is not double-counted)

  - id: "GQ-03"
    question: "What is our Working Capital, Current Ratio, and Quick Ratio as of 2026-02-28 in EUR?"
    tests_semantics: ["point_in_time_cutoff", "working_capital", "current_ratio", "quick_ratio"]
    expected_interpretation:
      metrics: ["working_capital", "current_ratio", "quick_ratio"]
      filters: { company_code: "COMP_ES", posting_date_lt: "2026-03-01", currency: "EUR" }
    expected_result:
      # Current Assets = Cash (1000 - 100 - 50 = 850) + AR (500) + Inv (300 - 200 = 100) = 1450
      # Current Liabilities = AP (300) + ST Loan (400) = 700
      working_capital: 750.00    # 1450 - 700
      current_ratio: 2.07        # 1450 / 700 (2.0714...)
      quick_ratio: 1.93          # (1450 - 100) / 700 (1.9285...)

  - id: "GQ-04"
    question: "Show total operating revenue for Spain in February 2026."
    tests_semantics: ["country_resolution_via_gla", "multi_currency_grouping_guardrail"]
    expected_interpretation:
      metrics: ["operating_revenue"]
      filters: { "gla.country": "ES", fiscal_year: 2026, fiscal_period: 2 }
      group_by: ["jeh.currency"] # Triggered automatically because currency was not specified
    expected_result:
      - { currency: "EUR", operating_revenue: 500.00 }
      - { currency: "USD", operating_revenue: 200.00 }

  - id: "GQ-05"
    question: "What is our gross margin % in January 2026 in EUR?"
    tests_semantics: ["zero_division_handling"]
    expected_interpretation:
      metrics: ["gross_margin_pct"]
      filters: { fiscal_year: 2026, fiscal_period: 1, currency: "EUR" }
    expected_result:
      gross_margin_pct: null     # Operating revenue is 0 in Jan 2026 -> must return NULL, not error

  - id: "GQ-06"
    question: "Run the untagged P&L reconciliation check for 2026."
    tests_semantics: ["governance_audit_check"]
    expected_result:
      untagged_pnl_check: 0.00   # Proves 100% of posted revenue/expense lines are mapped to tags

  - id: "GQ-07"
    question: "Show me operating revenue broken down by customer country."
    tests_semantics: ["non_goal_rejection_unlinked_tables"]
    expected_behavior: "REFUSE_WITH_EXPLANATION"
    reason: >
      core.customer has no physical foreign key to journal entries in MVP;
      country breakdowns are only supported via core.gl_account.country.
