[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlingo-agent-stack"
version = "0.1.0"
description = "Script-first agentic core for LedgerLingoAI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "litellm>=1.63,<2",
    "openai>=1.68,<3",
    "openai-agents>=0.20.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
ledgerlingo = "ledgerlingo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
[tool.setuptools.packages.find]
where = ["src"]
