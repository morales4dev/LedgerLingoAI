schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  LedgerLingoAI uses a script-first Python agent core under backend/src/ledgerlingo/.
  Supported Python: >=3.12,<3.14. Dependencies are declared in backend/pyproject.toml
  and locked in backend/uv.lock; the local environment is backend/.venv.
  The MVP caller submits one English text question per invocation and returns one
  English text response without carrying history between invocations.
  LiteLLM's async Python SDK calls configured providers directly. Provider/model
  selection and provider credentials come from environment-backed configuration.
  The application owns the bounded orchestration loop and uses Agents SDK
  @function_tool definitions without the SDK Runner.
  Backend unit tests live under backend/tests/unit/ and must run offline.
  Agent constitution: ai-specs/AGENTS.md. Standards: ai-specs/standards/python.md, ai-specs/standards/testing.md, ai-specs/standards/context7.md.
  Product specs: openspec/specs/. Do not invent product specs for tooling-only work.
  Language: English for repo content and for chat with the user.

rules:
  proposal:
    - Stay within the script-first async Python architecture; use LiteLLM's Python
      SDK directly for provider abstraction and Agents SDK function tools without
      delegating orchestration to its Runner.
      Do not invent product specs for tooling-only changes.
    - "OS-only / tooling-only changes set skip_specs: true and must not invent product specs."
    - Always include a Non-goals section.
  design:
    - Match the backend/src/ledgerlingo package, uv-managed backend/.venv,
      pyproject.toml, and uv.lock.
    - Project skills live under ai-specs/skills/. OpenSpec CLI skills stay under
      .agents/skills/.
  tasks:
    - Keep tasks small. Each task must include verification.
    - Do not invent product specs.
    - Archive only after explicit user approval. Do not archive in apply.
